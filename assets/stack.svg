<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="172" viewBox="0 0 1200 172" role="img" aria-label="Tech Stack">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Inter, "PingFang SC", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="171" rx="6" fill="#0a0a0a" stroke="#262626"/>
  <line x1="400" y1="28" x2="400" y2="144" stroke="#262626" stroke-width="1"/>
  <line x1="800" y1="28" x2="800" y2="144" stroke="#262626" stroke-width="1"/>

  <g transform="translate(48 44)">
    <text class="mono" x="0" y="0" fill="#737373" font-size="11" letter-spacing="1.5">01 / MOBILE &amp; SYSTEM</text>
    <text class="sans" x="0" y="34" fill="#fafafa" font-size="18" font-weight="600">Native &amp; Device</text>
    <text class="mono" x="0" y="72" fill="#a3a3a3" font-size="12.5">Kotlin · Compose · Media3</text>
    <text class="mono" x="0" y="96" fill="#737373" font-size="12.5">Room · USB DAC · AOSP</text>
  </g>

  <g transform="translate(448 44)">
    <text class="mono" x="0" y="0" fill="#737373" font-size="11" letter-spacing="1.5">02 / BACKEND &amp; AI</text>
    <text class="sans" x="0" y="34" fill="#fafafa" font-size="18" font-weight="600">Services &amp; MCP</text>
    <text class="mono" x="0" y="72" fill="#a3a3a3" font-size="12.5">Python · FastAPI · Go · Node.js</text>
    <text class="mono" x="0" y="96" fill="#737373" font-size="12.5">MCP · SQLite FTS5 · FastEmbed</text>
  </g>

  <g transform="translate(848 44)">
    <text class="mono" x="0" y="0" fill="#737373" font-size="11" letter-spacing="1.5">03 / WEB &amp; INFRA</text>
    <text class="sans" x="0" y="34" fill="#fafafa" font-size="18" font-weight="600">Interface &amp; Edge</text>
    <text class="mono" x="0" y="72" fill="#a3a3a3" font-size="12.5">Astro · React · ECharts</text>
    <text class="mono" x="0" y="96" fill="#737373" font-size="12.5">Linux · systemd · Workers</text>
  </g>
