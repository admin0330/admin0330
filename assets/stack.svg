<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img" aria-label="Tech Stack and Craft">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1116"/>
      <stop offset="1" stop-color="#151821"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Noto Sans SC", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="203" rx="16" fill="url(#sbg)" stroke="#262933" stroke-width="1.2"/>
  <line x1="400" y1="30" x2="400" y2="175" stroke="#242732" stroke-width="1"/>
  <line x1="800" y1="30" x2="800" y2="175" stroke="#242732" stroke-width="1"/>

  <g transform="translate(52 44)">
    <text class="mono" x="0" y="0" fill="#e06c58" font-size="11" letter-spacing="2">01 / NATIVE &amp; DEVICE</text>
    <text class="serif" x="0" y="34" fill="#f5f3ee" font-size="22" font-weight="500">Mobile &amp; System</text>
    <rect x="0" y="48" width="28" height="2" rx="1" fill="#e06c58"/>
    <text class="sans" x="0" y="80" fill="#d3d5dc" font-size="14">Kotlin · Jetpack Compose · Media3</text>
    <text class="sans" x="0" y="106" fill="#8f939e" font-size="13.5">Room · USB DAC · AOSP / Device Tree</text>
    <text class="mono" x="0" y="134" fill="#5e626e" font-size="10.5" letter-spacing="1.2">LOCAL-FIRST · BIT-PERFECT</text>
  </g>

  <g transform="translate(452 44)">
    <text class="mono" x="0" y="0" fill="#e06c58" font-size="11" letter-spacing="2">02 / AI &amp; BACKEND</text>
    <text class="serif" x="0" y="34" fill="#f5f3ee" font-size="22" font-weight="500">Agents &amp; Services</text>
    <rect x="0" y="48" width="28" height="2" rx="1" fill="#e06c58"/>
    <text class="sans" x="0" y="80" fill="#d3d5dc" font-size="14">Python · FastAPI · Go · Node.js</text>
    <text class="sans" x="0" y="106" fill="#8f939e" font-size="13.5">MCP · SQLite FTS5 · FastEmbed</text>
    <text class="mono" x="0" y="134" fill="#5e626e" font-size="10.5" letter-spacing="1.2">PROTOTYPE → VERIFY → REFINE</text>
  </g>

  <g transform="translate(852 44)">
    <text class="mono" x="0" y="0" fill="#e06c58" font-size="11" letter-spacing="2">03 / WEB &amp; EDGE</text>
    <text class="serif" x="0" y="34" fill="#f5f3ee" font-size="22" font-weight="500">Interface &amp; Infra</text>
    <rect x="0" y="48" width="28" height="2" rx="1" fill="#e06c58"/>
    <text class="sans" x="0" y="80" fill="#d3d5dc" font-size="14">Astro · React · ECharts</text>
    <text class="sans" x="0" y="106" fill="#8f939e" font-size="13.5">Linux · systemd · Cloudflare Workers</text>
    <text class="mono" x="0" y="134" fill="#5e626e" font-size="10.5" letter-spacing="1.2">QUIET UI · SELF-HOSTED</text>
