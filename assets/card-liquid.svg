  </defs>
  <rect x="1" y="1" width="578" height="198" rx="14" fill="url(#cbg1)" stroke="#262933" stroke-width="1.2"/>
  <text class="mono" x="28" y="38" fill="#e06c58" font-size="11.5" letter-spacing="2">01 · ANDROID / AUDIO</text>
  <text class="mono" x="552" y="38" fill="#e06c58" font-size="11.5" text-anchor="end">★ 6 · KOTLIN</text>
