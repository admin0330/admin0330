<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ym1r">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Inter, "PingFang SC", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="6" fill="#0a0a0a" stroke="#262626"/>

  <!-- Top hairline row -->
  <text class="mono" x="56" y="48" fill="#737373" font-size="12" letter-spacing="1.5">GITHUB.COM/ADMIN0330</text>
  <text class="mono" x="1144" y="48" fill="#737373" font-size="12" letter-spacing="1.5" text-anchor="end">EST. 2021</text>
  <line x1="56" y1="68" x2="1144" y2="68" stroke="#262626" stroke-width="1"/>

  <!-- Main title block -->
  <text class="sans" x="54" y="176" fill="#fafafa" font-size="84" font-weight="700" letter-spacing="-2.5">Ym1r</text>
  <text class="sans" x="58" y="218" fill="#a3a3a3" font-size="18" font-weight="400">Software, native apps, and self-hosted tools.</text>

  <!-- Right-aligned minimal index -->
  <g transform="translate(1144 134)" text-anchor="end">
    <text class="mono" x="0" y="0" fill="#fafafa" font-size="13" letter-spacing="1">ANDROID / KOTLIN</text>
    <text class="mono" x="0" y="26" fill="#a3a3a3" font-size="13" letter-spacing="1">PYTHON / FASTAPI / MCP</text>
    <text class="mono" x="0" y="52" fill="#737373" font-size="13" letter-spacing="1">GO / LINUX / ASTRO</text>
  </g>

  <!-- Bottom hairline row -->
  <line x1="56" y1="258" x2="1144" y2="258" stroke="#262626" stroke-width="1"/>
  <text class="mono" x="56" y="288" fill="#737373" font-size="11.5" letter-spacing="1.5">LOCAL-FIRST</text>
  <text class="mono" x="600" y="288" fill="#525252" font-size="11.5" letter-spacing="1.5" text-anchor="middle">·</text>
  <text class="mono" x="1144" y="288" fill="#fafafa" font-size="11.5" letter-spacing="1.5" text-anchor="end">BLACK &amp; WHITE</text>
