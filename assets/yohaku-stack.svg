<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Ym1r — Craft &amp; Stack</title>
  <desc id="stack-desc">Three editorial columns detailing Mobile &amp; System, AI &amp; Backend, and Web &amp; Infra technologies.</desc>
  <defs>
    <linearGradient id="paper-stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f8f5"/>
      <stop offset="1" stop-color="#f2f0ec"/>
    </linearGradient>
    <clipPath id="frame-stack"><rect x="1" y="1" width="1198" height="218" rx="16"/></clipPath>
    <style>
      .sans { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .serif { font-family: Georgia, "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Noto Sans Mono CJK SC", monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame-stack)">
    <rect width="1200" height="220" fill="url(#paper-stack)"/>

    <!-- Subtle vertical hairlines dividing the three columns -->
    <line x1="400" y1="34" x2="400" y2="186" stroke="#dedcd5" stroke-width="1"/>
    <line x1="800" y1="34" x2="800" y2="186" stroke="#dedcd5" stroke-width="1"/>

    <!-- Column 01 -->
    <g transform="translate(56 46)">
      <text class="mono" x="0" y="0" fill="#c56473" font-size="11" letter-spacing="2">01 / MOBILE &amp; SYSTEM</text>
      <text class="serif" x="0" y="34" fill="#141312" font-size="22" font-weight="500">Native &amp; Device</text>
      <line x1="0" y1="50" x2="28" y2="50" stroke="#c56473" stroke-width="2" stroke-linecap="round"/>
      <text class="sans" x="0" y="82" fill="#403f3a" font-size="14">Kotlin · Jetpack Compose · Media3</text>
      <text class="sans" x="0" y="108" fill="#5c5a55" font-size="13.5">Room · USB DAC · AOSP / LineageOS</text>
      <text class="mono" x="0" y="138" fill="#8a877f" font-size="11" letter-spacing="1">LOCAL-FIRST · BIT-PERFECT</text>
    </g>

    <!-- Column 02 -->
    <g transform="translate(456 46)">
      <text class="mono" x="0" y="0" fill="#c56473" font-size="11" letter-spacing="2">02 / AI &amp; BACKEND</text>
      <text class="serif" x="0" y="34" fill="#141312" font-size="22" font-weight="500">Systems &amp; Agents</text>
      <line x1="0" y1="50" x2="28" y2="50" stroke="#c56473" stroke-width="2" stroke-linecap="round"/>
      <text class="sans" x="0" y="82" fill="#403f3a" font-size="14">Python · FastAPI · Go · Node.js</text>
      <text class="sans" x="0" y="108" fill="#5c5a55" font-size="13.5">MCP · SQLite FTS5 · FastEmbed</text>
      <text class="mono" x="0" y="138" fill="#8a877f" font-size="11" letter-spacing="1">PROTOTYPE → VERIFY → REFINE</text>
    </g>

    <!-- Column 03 -->
    <g transform="translate(856 46)">
      <text class="mono" x="0" y="0" fill="#c56473" font-size="11" letter-spacing="2">03 / WEB &amp; INFRA</text>
      <text class="serif" x="0" y="34" fill="#141312" font-size="22" font-weight="500">Interface &amp; Edge</text>
      <line x1="0" y1="50" x2="28" y2="50" stroke="#c56473" stroke-width="2" stroke-linecap="round"/>
      <text class="sans" x="0" y="82" fill="#403f3a" font-size="14">Astro · React · ECharts</text>
      <text class="sans" x="0" y="108" fill="#5c5a55" font-size="13.5">Linux · systemd · Cloudflare Workers</text>
      <text class="mono" x="0" y="138" fill="#8a877f" font-size="11" letter-spacing="1">QUIET UI · SELF-HOSTED</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="218" rx="16" fill="none" stroke="#d0cec6"/>
</svg>
