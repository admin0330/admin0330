<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Ym1r — Build with intuition, walk with attention</title>
  <desc id="footer-desc">A minimalist contour-line colophon banner in warm paper and plum tones.</desc>
  <defs>
    <linearGradient id="paper-foot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f8f5"/>
      <stop offset="1" stop-color="#f0efeb"/>
    </linearGradient>
    <clipPath id="frame-foot"><rect x="1" y="1" width="1198" height="138" rx="16"/></clipPath>
    <style>
      .sans { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .serif { font-family: Georgia, "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Noto Sans Mono CJK SC", monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame-foot)">
    <rect width="1200" height="140" fill="url(#paper-foot)"/>

    <!-- Gentle contour waves -->
    <g fill="none" stroke="#d8d5cc" stroke-width="1" opacity=".75">
      <path d="M-40 108C140 62 290 126 480 94s310-44 500 8 180-12 260-36"/>
      <path d="M-40 124C160 84 310 136 510 108s290-36 470 10 190-8 260-28"/>
    </g>

    <!-- Minimalist trail dots & plum marker -->
    <line x1="88" y1="48" x2="260" y2="48" stroke="#c5c2b9" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="88" cy="48" r="3" fill="#a8a69f"/>
    <circle cx="260" cy="48" r="4" fill="#c56473"/>

    <text class="serif" x="88" y="88" fill="#141312" font-size="22" font-weight="500">“Living a life by design.”</text>

    <g transform="translate(1112 58)" text-anchor="end">
      <text class="mono" x="0" y="0" fill="#5c5a55" font-size="11.5" letter-spacing="2">BUILD WITH INTUITION</text>
      <text class="mono" x="0" y="22" fill="#8a877f" font-size="11.5" letter-spacing="2">WALK WITH ATTENTION</text>
      <text class="serif" x="0" y="50" fill="#c56473" font-size="13" letter-spacing="2">余白 · YOHAKU</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="138" rx="16" fill="none" stroke="#d0cec6"/>
</svg>
