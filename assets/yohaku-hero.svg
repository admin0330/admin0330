<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ym1r — between code and the trail</title>
  <desc id="desc">A warm paper landscape with contour lines, mountains, a winding path, and restrained plum accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f8f5"/>
      <stop offset="1" stop-color="#f0efeb"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e1db" stop-opacity="0"/>
      <stop offset="1" stop-color="#e3e1db" stop-opacity=".9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="16"/></clipPath>
    <style>
      .sans { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .serif { font-family: Georgia, "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Noto Sans Mono CJK SC", monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#paper)"/>

    <g fill="none" stroke="#d0cec6" stroke-width="1" opacity=".58">
      <path d="M-80 88C86 10 199 32 303 92s220 74 352 9 292-62 441 25 224 22 286-30"/>
      <path d="M-72 111C77 38 197 55 299 111s226 65 356 3 282-56 430 24 226 24 300-24"/>
      <path d="M-58 136C82 68 194 76 297 132s230 59 358 1 272-50 419 25 225 29 305-20"/>
      <path d="M-42 163C93 99 195 99 301 153s229 54 356 2 265-44 410 26 223 31 306-15"/>
    </g>

    <circle cx="1040" cy="82" r="34" fill="#c56473" opacity=".92"/>
    <circle cx="1040" cy="82" r="49" fill="none" stroke="#c56473" stroke-width="1" opacity=".25"/>

    <path d="M0 348L152 216l80 69 136-145 111 123 101-80 155 146 112-89 83 54 151-127 139 139v114H0Z" fill="#e3e1db" opacity=".78"/>
    <path d="M0 375L191 270l93 59 130-109 123 99 94-48 112 77 95-54 134 66 111-77 137 88v49H0Z" fill="#d0cec6" opacity=".72"/>
    <path d="M0 382c172-38 297-22 430-4s266 30 393-1 241-26 377-1v44H0Z" fill="url(#mist)"/>

    <path d="M965 420c-24-67-6-113 18-147 18-25 26-55 16-85" fill="none" stroke="#f9f8f5" stroke-width="11" stroke-linecap="round" opacity=".92"/>
    <path d="M965 420c-24-67-6-113 18-147 18-25 26-55 16-85" fill="none" stroke="#a8a69f" stroke-width="1" stroke-dasharray="5 9" stroke-linecap="round"/>

    <g transform="translate(88 102)">
      <text class="mono" x="0" y="0" fill="#5c5a55" font-size="13" letter-spacing="3">HELLO, I AM</text>
      <text class="serif" x="-2" y="75" fill="#141312" font-size="78" font-weight="500" letter-spacing="1">Ym1r</text>
      <rect x="0" y="103" width="48" height="3" rx="1.5" fill="#c56473"/>
      <text class="sans" x="0" y="144" fill="#403f3a" font-size="18" letter-spacing="1.2">between code and the trail</text>
      <text class="mono" x="0" y="180" fill="#787670" font-size="12" letter-spacing="2">VIBE CODING  ·  OUTDOOR HIKING  ·  SLOW CURIOSITY</text>
    </g>

    <g transform="translate(1121 114)">
      <text class="serif" x="0" y="0" fill="#403f3a" font-size="16" text-anchor="middle">余</text>
      <text class="serif" x="0" y="25" fill="#403f3a" font-size="16" text-anchor="middle">白</text>
      <line x1="0" y1="40" x2="0" y2="104" stroke="#a8a69f"/>
    </g>

    <g transform="translate(89 355)" class="mono" font-size="11" fill="#5c5a55" letter-spacing="1.4">
      <text x="0" y="0">34.0000° N</text>
      <text x="0" y="20">BUILD / WALK / NOTICE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#d0cec6"/>
